# =============================================================================
# frontend/nginx.conf -- Production nginx configuration
# =============================================================================
# Port   : 3000 (matches docker-compose.yml and Dockerfile EXPOSE)
# Routes :
#   /api/*    -- reverse-proxied to the backend API container (api:4000)
#   /health   -- reverse-proxied to the backend API container (api:4000)
#   /*        -- served from the Vite static build (SPA fallback to index.html)
# =============================================================================

server {
    listen 3000;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options        SAMEORIGIN       always;
    add_header X-Content-Type-Options nosniff          always;
    add_header X-XSS-Protection       '1; mode=block'  always;
    add_header Referrer-Policy        'strict-origin-when-cross-origin' always;

    # -------------------------------------------------------------------------
    # Gzip compression for text assets
    # -------------------------------------------------------------------------
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # -------------------------------------------------------------------------
    # API proxy -- forward /api and /health to the Express backend
    # -------------------------------------------------------------------------
    location /api {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # -------------------------------------------------------------------------
    # Static assets -- long cache for hashed filenames (Vite output)
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control 'public, immutable';
        access_log off;
    }

    # -------------------------------------------------------------------------
    # SPA fallback -- all other paths serve index.html (React Router handles routing)
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
